[project]
name = "mapqa"
version = "0.1.0"
description = "Map Attribute QA Copilot: candidates for manual review of road attributes (OSM, Overture, street photos)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==23.0.1",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "jinja2==3.1.6",
    "pillow==12.0.0",
]

[project.scripts]
mapqa = "mapqa.cli:entry_point"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "respx==0.23.1",
    "geopandas==1.2.0",
    "pyproj==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e and not paid' -p no:cacheprovider"
markers = [
    "e2e: real CLI run on course data files (offline, no paid API)",
    "paid: sends real requests to OpenRouter; run only with explicit consent",
]
